<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printable QR · AWS Cloud Club light show</title>
<link rel="stylesheet" href="ui.css">
<style>
  @page { size: A4; margin: 0; }
  body { background: #2a2a2c; color: #171717; }
  .bar { padding: 16px; text-align: center; font-size: 13px; color: #ededed; }
  .bar button { margin-left: 12px; height: 40px; padding: 0 20px; border-radius: 8px; border: 0; background: #ff9900; color: #1a1206; font: 500 14px var(--mono); cursor: pointer; }
  .page { width: 210mm; height: 297mm; margin: 0 auto 24px; background: #fff; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 18mm; page-break-after: always; }
  .kicker { font-size: 12pt; color: #737373; }
  #banner { color: #171717; margin: 10mm 0 10mm; }
  #qr svg { width: 140mm; height: 140mm; display: block; }
  .scan { font-size: 22pt; font-weight: 500; margin-top: 10mm; }
  .url { font-size: 11pt; margin-top: 3mm; color: #525252; word-break: break-all; }
  .tip { font-size: 11pt; margin-top: 6mm; color: #737373; }
  @media print { body { background: #fff; } .bar { display: none; } .page { margin: 0; } }
</style>
</head>
<body>
<div class="bar">Print this page and put copies on seats, walls and the entrance <button onclick="print()">Print</button></div>
<div class="page">
  <div class="kicker" id="club"></div>
  <pre class="art" id="banner"></pre>
  <div id="qr"></div>
  <div class="scan">Scan to join the show</div>
  <div class="url" id="url"></div>
  <div class="tip">brightness up · keep your screen on</div>
</div>
<script src="show-config.js"></script>
<script src="ascii.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
  const S = window.SHOW;
  const joinUrl = location.origin + location.pathname.replace(/qr\.html$/, '');
  document.getElementById('club').textContent = S.club;
  const rows = ASCII.banner('LIGHT SHOW');
  const b = document.getElementById('banner');
  b.textContent = rows.join('\n');
  b.style.fontSize = (170 / (Math.max(...rows.map((r) => r.length)) * 0.6)) + 'mm';
  document.getElementById('url').textContent = joinUrl.replace(/^https?:\/\//, '');
  const q = qrcode(0, 'M'); q.addData(joinUrl); q.make();
  document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
</script>
</body>
</html>
