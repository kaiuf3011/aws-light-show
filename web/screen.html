<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big screen · AWS Cloud Club light show</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .layer { position: fixed; inset: 0; }
  #fx { background: var(--bg); }
  #ui { display: flex; flex-direction: column; padding: 4vh 4vw 3vh; transition: opacity .4s var(--ease); background: var(--bg); }
  #ui.hide { opacity: 0; pointer-events: none; }
  .bar-top { display: flex; justify-content: space-between; font-size: 1vw; color: var(--muted); }
  .bar-top b { color: var(--good); font-weight: 400; }
  .main { flex: 1; display: grid; grid-template-columns: 1.35fr 1fr; gap: 4vw; align-items: center; }
  h1 { font-size: 2.4vw; font-weight: 500; margin: 0 0 3vh; line-height: 1.2; }
  #count { color: var(--accent); }
  .countLabel { font-size: 1.15vw; color: var(--text-2); margin: 1.6vh 0 4vh; }
  #grid { font-size: 1.05vw; line-height: 1.35; white-space: pre; color: var(--text-2); min-height: 11em; }
  #grid .new { color: var(--accent); }
  #grid .more { color: var(--muted); }
  .right { display: flex; flex-direction: column; align-items: flex-start; }
  .qrcard { background: #fff; border-radius: 16px; padding: 1.4vw; }
  #qr svg { display: block; width: 24vw; height: 24vw; max-width: 52vh; max-height: 52vh; }
  .scan { font-size: 1.5vw; font-weight: 500; margin-top: 2.4vh; }
  .url { font-size: 0.95vw; color: var(--muted); margin-top: .6vh; }
  #cities { font-size: 1vw; color: var(--text-2); margin-top: 2.4vh; min-height: 1.5em; }
  #log { font-size: 0.95vw; line-height: 1.7; color: var(--muted); min-height: 6.8em; border-top: 1px solid var(--line); padding-top: 1.6vh; }
  #log .t { color: #5f5f64; }
  #log .last { color: var(--text-2); }

  #corner { position: fixed; top: 3vh; left: 3vw; font-size: 1.2vw; opacity: 0; transition: opacity .3s var(--ease); }
  #corner.on { opacity: 1; }
  #label { display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 5vw; pointer-events: none; }
  #label pre { font-size: 1.6vw; }
  #label .text { font-size: 5vw; font-weight: 500; line-height: 1.15; }

  #poster { display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-deep); }
  #poster.on { display: flex; }
  #posterArt { color: var(--accent); }
  #posterCanvas { display: none; }
  #lobby { font-size: 1.35vw; color: var(--accent); margin: 0 0 2vh; min-height: 1.5em; white-space: pre; }
  #power { position: fixed; left: 0; right: 0; bottom: 5vh; text-align: center; font-size: 1.25vw; color: var(--text-2); white-space: pre; display: none; }
  #power.on { display: block; }
  #power b { color: var(--accent); font-weight: 400; }

  #tugv { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4.5vh; background: var(--bg); }
  #tugv.on { display: flex; }
  .tv-title { font-size: 1.2vw; color: var(--muted); }
  .teams { display: flex; justify-content: space-between; align-items: flex-end; width: 88vw; }
  .team .art { font-size: 1vw; }
  .team .pulls { font-size: 1.2vw; color: var(--text-2); margin-top: 1.4vh; }
  #rope { font-size: 2vw; line-height: 1.25; }
  #tvHint { font-size: 1.15vw; color: var(--muted); }

  #winv { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; background: var(--bg); }
  #winv.on { display: flex; }
  #winScore { font-size: 1.4vw; color: var(--text-2); }

  #teaser { display: none; align-items: center; justify-content: center; background: var(--bg-deep); }
  #teaser.on { display: flex; }
  #term { font-size: 1.9vw; line-height: 1.7; white-space: pre; min-width: 46vw; }
  #term .p { color: var(--muted); }
  #term .zero { color: var(--accent); }
  #tzQ { font-size: 2.2vw; font-weight: 500; line-height: 1.35; margin-top: 5vh; max-width: 66vw; white-space: normal; opacity: 0; transition: opacity .5s var(--ease); }
  #tzCta { font-size: 1.4vw; color: var(--text-2); margin-top: 2vh; white-space: normal; opacity: 0; transition: opacity .5s var(--ease); }
  #tzCta b { color: var(--accent); font-weight: 400; }
  .in { opacity: 1 !important; }

  #backv { display: none; flex-direction: column; justify-content: center; align-items: center; padding: 5vh 4vw; background: var(--bg-deep); }
  #backv > * { width: 88vw; }
  #backv.on { display: flex; }
  .bv-top { font-size: 1.15vw; color: var(--muted); margin-bottom: 4vh; }
  .bv-top b { color: var(--text-2); font-weight: 400; }
  #diagram { font-size: 1.58vw; line-height: 1.45; color: var(--text-2); }
  #diagram .h { color: var(--text); font-weight: 500; }
  #diagram .n { color: var(--text); }
  #diagram .a { color: var(--accent); }
  #diagram .m { color: var(--muted); }
  #blog { margin-top: 5vh; font-size: 1.05vw; line-height: 1.75; color: var(--muted); border-top: 1px solid var(--line); padding-top: 2vh; min-height: 12em; }
  #blog .t { color: #5f5f64; }
  #blog div:last-child { color: var(--text-2); }
  #conn { position: fixed; right: 1.5vw; bottom: 1.2vh; font-size: .8vw; color: #4a4a4f; }
</style>
</head>
<body>
<div id="fx" class="layer"></div>

<div id="ui" class="layer">
  <div class="bar-top"><span id="prompt"></span><span id="liveTag">connecting…</span></div>
  <div class="main">
    <div>
      <div id="lobby"></div>
      <h1 id="title"></h1>
      <pre class="art" id="count"></pre>
      <div class="countLabel">phones connected</div>
      <div id="grid"></div>
    </div>
    <div class="right">
      <div class="qrcard"><div id="qr"></div></div>
      <div class="scan">Scan to join the show</div>
      <div class="url" id="url"></div>
      <div id="cities"></div>
    </div>
  </div>
  <div id="log"></div>
</div>

<div id="corner"></div>
<div id="label" class="layer"></div>

<div id="poster" class="layer"><pre class="art" id="posterArt"></pre><canvas id="posterCanvas"></canvas></div>
<div id="power"></div>

<div id="tugv" class="layer">
  <div class="tv-title">tug of war</div>
  <pre class="art" id="tvTimer"></pre>
  <div class="teams">
    <div class="team"><pre class="art" id="tvA"></pre><div class="pulls" id="tvAn"></div></div>
    <div class="team" style="text-align:right"><pre class="art" id="tvB"></pre><div class="pulls" id="tvBn"></div></div>
  </div>
  <pre class="art" id="rope"></pre>
  <div id="tvHint">tap pull on your phone, as fast as you can</div>
</div>

<div id="winv" class="layer"><pre class="art" id="winArt"></pre><div id="winScore"></div></div>

<div id="teaser" class="layer">
  <div><pre class="art" id="term"></pre><div id="tzQ"></div><div id="tzCta"></div></div>
</div>

<div id="backv" class="layer">
  <div class="bv-top">$ light-show --backend <b>· live from aws</b></div>
  <pre class="art" id="diagram"></pre>
  <div id="blog"></div>
</div>

<div id="conn"></div>

<script src="config.js"></script>
<script src="show-config.js"></script>
<script src="ascii.js"></script>
<script src="effects.js"></script>
<script src="client.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
(function () {
  const S = window.SHOW;
  const $ = (id) => document.getElementById(id);
  const VW = () => window.innerWidth / 100, VH = () => window.innerHeight / 100;
  const region = (() => { const m = String(window.WS_URL || '').match(/execute-api\.([a-z0-9-]+)\./); return m ? m[1] : 'local'; })();
  $('title').textContent = S.title;
  $('prompt').textContent = 'aws-cloud-club@rgu:~$ ./light-show --live';

  // block letters sized to a box (width and height in px)
  function art(el, text, w, h, rows) {
    rows = rows || ASCII.banner(text);
    const key = rows.join('|') + Math.round(w) + 'x' + Math.round(h);
    if (el.dataset.k === key) return;
    el.dataset.k = key;
    const cols = Math.max(1, ...rows.map((r) => r.length));
    el.style.fontSize = Math.min(w / (cols * 0.6), h / rows.length) + 'px';
    el.textContent = rows.join('\n');
  }

  const joinUrl = location.origin + location.pathname.replace(/screen\.html$/, '');
  $('url').textContent = joinUrl.replace(/^https?:\/\//, '');
  try {
    const q = qrcode(0, 'M');
    q.addData(joinUrl); q.make();
    $('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  } catch (e) { $('qr').textContent = joinUrl; }

  // ----- the Power-Up poster, as characters that boot up -----
  let posterRows = [], reveal = null;
  (function buildPoster() {
    const fromText = () => {
      const rows = [];
      (S.posterBanner || ['AWS', 'CLOUD CLUB']).forEach((line, i) => { if (i) rows.push(''); rows.push(...ASCII.banner(line)); });
      const w = Math.max(...rows.map((r) => r.length));
      const centered = rows.map((r) => ' '.repeat(Math.floor((w - r.length) / 2)) + r);
      const cap = S.posterCaption || '';
      if (cap) { centered.push('', '', ' '.repeat(Math.max(0, Math.floor((w - cap.length) / 2))) + cap); }
      posterRows = centered; reveal = ASCII.Reveal(posterRows);
    };
    if (S.poster) {
      const img = new Image();
      img.onload = () => preparePoster(img);
      img.onerror = fromText;
      img.src = S.poster;
    } else fromText();
  })();

  // ----- image poster: revealed tile by tile, centre first; tiles about to appear flicker as characters -----
  let pImg = null, pTiles = [], pCols = 30, pRows = 38;
  const RAMP = ' .:-=+*#%@', NOISE = '.:-=+*#';
  function preparePoster(img) {
    pImg = img;
    pRows = Math.round(pCols * img.height / img.width);
    const c = document.createElement('canvas'); c.width = pCols; c.height = pRows;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0, pCols, pRows);
    const px = x.getImageData(0, 0, pCols, pRows).data; // read once, never in the loop
    pTiles = [];
    for (let r = 0; r < pRows; r++) for (let q = 0; q < pCols; q++) {
      const k = (r * pCols + q) * 4;
      const light = (0.2126 * px[k] + 0.7152 * px[k + 1] + 0.0722 * px[k + 2]) / 255;
      const dx = (q + 0.5) / pCols - 0.5, dy = (r + 0.5) / pRows - 0.5;
      const dist = Math.min(1, Math.sqrt(dx * dx + dy * dy) / 0.7);
      pTiles.push({ q, r, light, color: `rgb(${px[k]},${px[k + 1]},${px[k + 2]})`,
        th: Math.min(0.985, 0.72 * Math.random() + 0.26 * dist), seed: Math.random() * 1000 });
    }
  }
  function drawPoster(level, now, flash) {
    const cv = $('posterCanvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const H = Math.floor(84 * VH()), W = Math.floor(H * pImg.width / pImg.height);
    if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0f0f10'; ctx.fillRect(0, 0, W, H);
    if (level >= 1) ctx.drawImage(pImg, 0, 0, W, H);
    else {
      const tw = W / pCols, th = H / pRows, sw = pImg.width / pCols, sh = pImg.height / pRows;
      ctx.font = `500 ${Math.floor(th * 0.95)}px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const slot = Math.floor(now / 90);
      for (const t of pTiles) {
        if (level >= t.th) ctx.drawImage(pImg, t.q * sw, t.r * sh, sw, sh, t.q * tw, t.r * th, tw + 0.6, th + 0.6);
        else if (t.th - level < 0.09) {
          const f = Math.abs(Math.sin(t.seed + slot * 1.7));
          if (f < 0.7) {
            ctx.fillStyle = t.color;
            const ch = f < 0.35 ? RAMP[Math.max(1, Math.floor(t.light * (RAMP.length - 1)))] : NOISE[Math.floor(f * 10) % NOISE.length];
            ctx.fillText(ch, t.q * tw + tw / 2, t.r * th + th / 2);
          }
        }
      }
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  }

  // ----- the server-log ticker (signature) -----
  const log = [];
  function addLog(text) {
    log.push({ at: client ? client.serverNow() : Date.now(), text });
    while (log.length > 9) log.shift();
    const line = (l, last) => `<div class="${last ? 'last' : ''}"><span class="t">[${ASCII.stamp(l.at)}]</span> ${esc(l.text)}</div>`;
    $('log').innerHTML = log.slice(-4).map((l, i, a) => line(l, i === a.length - 1)).join('');
    $('blog').innerHTML = log.map((l, i) => line(l, i === log.length - 1)).join('');
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let shown = 0, target = 0, cities = {}, lastStats = null;
  // one ■ per connected phone; the newest ones glow in the accent for a few seconds
  let fresh = 0, freshUntil = 0;
  function drawGrid(n) {
    const COLS = 40, MAX = COLS * 10;
    const shownN = Math.min(n, MAX);
    const isNew = (i) => performance.now() < freshUntil && i >= shownN - fresh;
    let html = '';
    for (let i = 0; i < shownN; i++) {
      html += isNew(i) ? '<span class="new">■</span>' : '■';
      html += (i + 1) % COLS === 0 ? '\n' : ' ';
    }
    if (n > MAX) html += `<span class="more">+${n - MAX} more</span>`;
    $('grid').innerHTML = html;
  }
  // backend view numbers: Lambda runs per second from the invocation counter in DynamoDB
  let rate = 0, prevCalls = null, prevNow = 0, lastStatsMsg = null, lastCast = null, pushPulse = 0;
  function onStats(m) {
    if (m.calls != null) {
      if (prevCalls != null && m.now > prevNow && m.calls >= prevCalls) {
        const r = (m.calls - prevCalls) / ((m.now - prevNow) / 1000);
        rate = rate * 0.5 + r * 0.5;
      }
      prevCalls = m.calls; prevNow = m.now;
    }
    lastStatsMsg = m;
    target = m.phones;
    if (lastStats && m.phones > lastStats.phones) { fresh = m.phones - lastStats.phones; freshUntil = performance.now() + 3000; }
    drawGrid(m.phones);
    cities = m.cities || {};
    const names = Object.keys(cities);
    $('cities').textContent = names.length ? 'also live from  ' + names.map((n) => n.toLowerCase() + (cities[n] > 1 ? ' ×' + cities[n] : '')).join(' · ') : '';
    if (lastStats) {
      const d = m.phones - lastStats.phones;
      if (d > 0) addLog(`+${d} phone${d > 1 ? 's' : ''} joined · ${m.phones} connected`);
      if (d < 0) addLog(`${-d} phone${d < -1 ? 's' : ''} left · ${m.phones} connected`);
      names.filter((n) => !(lastStats.cities || {})[n]).forEach((n) => addLog(`new city on the line: ${n.toLowerCase()}`));
    }
    lastStats = m;
  }

  let client = null;
  client = ShowClient({
    role: 'screen',
    onStatus: (s) => {
      $('liveTag').innerHTML = s === 'open' ? `<b>●</b> live · ${region}` : s + '…';
      $('conn').textContent = s === 'open' ? '' : s + '…';
      if (s === 'open') addLog(`screen connected to aws · ${region}`);
    },
    onMessage: (m) => {
      if (m.type === 'stats') onStats(m);
      else if (m.type === 'effect') {
        player.push(m);
        if (m.effect.name !== 'off' && m.effect.name !== 'backend') {
          addLog(`effect "${m.effect.name}" scheduled for ${ASCII.stamp(m.at)}`);
          lastCast = { name: m.effect.name, at: m.at, phones: lastStatsMsg ? lastStatsMsg.phones : 0 };
          pushPulse = performance.now();
        }
      }
      else if (m.type === 'charge') charge = m;
      else if (m.type === 'tug') tug = m;
    },
  });
  const player = EffectPlayer(client);
  setInterval(() => client.send({ action: 'stats' }), 1500);
  let charge = { level: 0, tappers: 0 }, curName = null, powerShown = 0;
  setInterval(() => { if (curName === 'charge' || curName === 'powered') client.send({ action: 'charge' }); }, 400);
  let tug = null, tugPos = 0;
  setInterval(() => { if (curName === 'tug') client.send({ action: 'tugstate' }); }, 300);

  const screenMe = { zone: 'center', dept: null, seed: 7 };
  const LABELS = { wave: 'wave', sparkle: 'stars', team: 'team colours', rainbow: '', strobe: '', pulse: '', color: '' };
  const fmt = (n) => Number(n || 0).toLocaleString('en-IN');

  function loop() {
    shown += (target - shown) * 0.15;
    if (Math.abs(target - shown) < 0.5) shown = target;
    art($('count'), String(Math.round(shown)), 44 * VW(), 26 * VH());
    $('corner').textContent = Math.round(shown) + ' phones live';

    const { effect, t } = player.frame();
    let f = Effects.render(effect, t, screenMe);
    let label = f.big;
    if (effect && effect.name === 'team') { f = { bg: 'var(--bg)' }; label = 'team colours'; }
    if (effect && effect.name === 'spotlight') {
      const col = Effects.deptColor(effect.dept);
      f = { bg: Effects.dim(col, 0.65 + 0.35 * Math.sin(t / 160)), fg: '#141415' };
      label = effect.dept;
    }
    const name = effect ? effect.name : null;
    if (name === 'charge' && curName !== 'charge') { charge = { level: 0, tappers: 0 }; powerShown = 0; }
    curName = name;

    // Power-Up: the poster boots up character by character
    const posterMode = name === 'charge' || name === 'powered';
    $('poster').classList.toggle('on', posterMode);
    $('power').classList.toggle('on', name === 'charge');
    $('posterArt').style.display = pImg ? 'none' : '';
    $('posterCanvas').style.display = pImg ? 'block' : 'none';
    if (posterMode && pImg) {
      label = ''; f = { bg: 'var(--bg-deep)' };
      const goal = name === 'powered' ? 1 : charge.level;
      powerShown += (goal - powerShown) * 0.08;
      const lvl = name === 'powered' ? 1 : powerShown;
      drawPoster(lvl, performance.now(), name === 'powered' ? Math.max(0, 0.8 - t / 600) : 0);
      const pct = String(Math.floor(powerShown * 100)).padStart(3, ' ');
      $('power').innerHTML = `power  [<b>${ASCII.bar(powerShown, 32)}</b>] ${pct}%   ${charge.tappers || 0} tapping`;
    } else if (posterMode && reveal) {
      label = ''; f = { bg: 'var(--bg-deep)' };
      const goal = name === 'powered' ? 1 : charge.level;
      powerShown += (goal - powerShown) * 0.08;
      const lvl = name === 'powered' ? 1 : powerShown;
      const cols = Math.max(...posterRows.map((r) => r.length));
      const el = $('posterArt');
      el.style.fontSize = Math.min(88 * VW() / (cols * 0.6), 74 * VH() / posterRows.length) + 'px';
      el.textContent = reveal.render(lvl, performance.now());
      el.style.color = name === 'powered' && t < 450 ? '#ffffff' : '';
      const pct = String(Math.floor(powerShown * 100)).padStart(3, ' ');
      $('power').innerHTML = `power  [<b>${ASCII.bar(powerShown, 32)}</b>] ${pct}%   ${charge.tappers || 0} tapping`;
    }

    // Tug of war: block-letter timer and a rope made of characters
    const tugOn = name === 'tug';
    $('tugv').classList.toggle('on', tugOn);
    if (tugOn) {
      label = ''; f = { bg: 'var(--bg)' };
      const teams = Effects.tugTeams(effect);
      const now = client.serverNow();
      const sc = tug && tug.startsAt === effect.startsAt ? tug : { a: 0, b: 0, goal: effect.goal || 1 };
      art($('tvA'), teams.A.name, 30 * VW(), 10 * VH()); $('tvA').style.color = teams.A.color;
      art($('tvB'), teams.B.name, 30 * VW(), 10 * VH()); $('tvB').style.color = teams.B.color;
      $('tvAn').textContent = `${effect.sizeA || 0} phones · ${fmt(sc.a)} pulls`;
      $('tvBn').textContent = `${fmt(sc.b)} pulls · ${effect.sizeB || 0} phones`;
      let timer, col = 'var(--text)';
      if (now < effect.startsAt) { timer = String(Math.ceil((effect.startsAt - now) / 1000)); col = 'var(--accent)'; }
      else if (now < effect.endsAt) { const r = Math.ceil((effect.endsAt - now) / 1000); timer = `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`; if (r <= 5) col = 'var(--red)'; }
      else timer = 'TIME';
      art($('tvTimer'), timer, 50 * VW(), 18 * VH()); $('tvTimer').style.color = col;
      const goal = Math.max(-1, Math.min(1, (sc.b - sc.a) / (sc.goal || 1)));
      tugPos += (goal - tugPos) * 0.15;
      const W = 61, mid = (W - 1) / 2, k = Math.round(mid + tugPos * mid);
      $('rope').innerHTML =
        `${' '.repeat(mid + 1)}<span class="muted">│</span>\n` +
        `<span style="color:${teams.A.color}">${'═'.repeat(k)}</span>[█]<span style="color:${teams.B.color}">${'═'.repeat(W - 1 - k)}</span>\n` +
        `${' '.repeat(mid + 1)}<span class="muted">│</span>`;
    } else tugPos = 0;

    // result, then the terminal readout with the curiosity hook
    const teaserOn = name === 'tugwin' && t >= 5000;
    const winOn = name === 'tugwin' && !teaserOn;
    $('winv').classList.toggle('on', winOn);
    $('teaser').classList.toggle('on', teaserOn);
    if (winOn) {
      label = ''; f = { bg: 'var(--bg)' };
      const teams = Effects.tugTeams(effect);
      const draw = effect.winner === 'draw';
      art($('winArt'), draw ? 'DRAW' : teams[effect.winner].name + ' WINS', 86 * VW(), 30 * VH());
      $('winArt').style.color = t < 400 ? '#ffffff' : draw ? 'var(--text)' : teams[effect.winner].color;
      $('winScore').textContent = `${teams.A.name.toLowerCase()} ${fmt(effect.scoreA)}  ·  ${fmt(effect.scoreB)} ${teams.B.name.toLowerCase()}`;
    }
    if (teaserOn) {
      label = ''; f = { bg: 'var(--bg-deep)' };
      const T = S.tugTeaser || {};
      const total = (effect.scoreA || 0) + (effect.scoreB || 0);
      const fill = (x) => String(x || '').replace('{total}', fmt(total)).replace('{phones}', effect.phones || 'all these').replace('{seconds}', effect.seconds || '');
      const tt = t - 5000;
      const cmd = 'light-show stats --last-round';
      const typed = cmd.slice(0, Math.max(0, Math.floor(tt / 35)));
      const k = Math.min(1, Math.max(0, (tt - 1300) / 1200));
      const rows = [`<span class="p">$</span> ${typed}${typed.length < cmd.length ? '<span class="cursor"></span>' : ''}`];
      if (tt > 1300) rows.push('', `pulls counted   ${fmt(Math.round(total * k)).padStart(9)}`);
      if (tt > 1600) rows.push(`phones          ${String(Math.round((effect.phones || 0) * k)).padStart(9)}`);
      if (tt > 1900) rows.push(`seconds         ${String(Math.round((effect.seconds || 0) * k)).padStart(9)}`);
      if (tt > 3000) rows.push(`servers         <span class="zero">${'0'.padStart(9)}</span>`);
      $('term').innerHTML = rows.join('\n');
      $('tzQ').textContent = fill(T.question); $('tzQ').classList.toggle('in', tt >= 4000);
      $('tzCta').innerHTML = `${esc(fill(T.spoiler))}  ·  <b>${esc(fill(T.cta))}</b>`; $('tzCta').classList.toggle('in', tt >= 5500);
    } else { $('tzQ').classList.remove('in'); $('tzCta').classList.remove('in'); }

    // backend view: the system drawn in characters, with live numbers and moving packets
    const backOn = name === 'backend';
    $('backv').classList.toggle('on', backOn);
    if (backOn) { label = ''; f = { bg: 'var(--bg-deep)' }; drawBackend(performance.now()); }

    // joining window: keep the QR screen up, with a countdown to Power-Up
    const lobbyOn = name === 'lobby';
    if (lobbyOn) {
      label = '';
      const left = Math.max(0, (effect.seconds || 60) * 1000 - t);
      const s = Math.ceil(left / 1000);
      $('lobby').textContent = `power-up in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}  [${ASCII.bar(1 - left / ((effect.seconds || 60) * 1000), 24)}]`;
    } else $('lobby').textContent = '';
    const active = effect && effect.name !== 'off' && !lobbyOn && !backOn;
    $('fx').style.background = f.bg || 'var(--bg)';
    $('ui').classList.toggle('hide', !!active);
    $('corner').classList.toggle('on', !!active && !posterMode && !tugOn && !teaserOn && !winOn);
    const lab = active ? (label || LABELS[effect.name] || '') : '';
    const L = $('label');
    if (L.dataset.l !== lab) {
      L.dataset.l = lab;
      L.innerHTML = '';
      if (lab && /^[A-Z0-9 &%.:?\/-]{1,8}$/.test(lab)) { const p = document.createElement('pre'); p.className = 'art'; L.appendChild(p); }
      else if (lab) { const d = document.createElement('div'); d.className = 'text'; d.textContent = lab; L.appendChild(d); }
    }
    const p = L.querySelector('pre');
    if (p) art(p, lab, 80 * VW(), 40 * VH());
    L.style.color = f.fg || 'var(--text)';
    requestAnimationFrame(loop);
  }
  // ----- the backend diagram -----
  function arrow(dir, rateNow, now, len = 8) {
    // packets travel along the arrow; more traffic = faster and denser
    const cells = Array(len - 1).fill('─');
    if (rateNow > 0.2) {
      const speed = 4 + Math.min(rateNow, 80) / 3;           // cells per second
      const dots = rateNow > 25 ? 3 : rateNow > 6 ? 2 : 1;
      for (let d = 0; d < dots; d++) {
        const p = Math.floor(now / 1000 * speed + d * (len - 1) / dots) % (len - 1);
        cells[dir > 0 ? p : len - 2 - p] = '●';
      }
    }
    const body = cells.join('');
    return dir > 0 ? `<span class="a">${body}▶</span>` : `<span class="a">◀${body}</span>`;
  }
  const box = (txt, cls = 'n') => `│ <span class="${cls}">${esc(String(txt).padEnd(13).slice(0, 13))}</span> │`;
  function drawBackend(now) {
    const m = lastStatsMsg || { phones: 0, rows: 0 };
    const runs = Math.max(0, rate);
    const pushRate = now - pushPulse < 1500 ? Math.max(runs, (m.phones || 0) / 1.2) : runs * 0.6;
    const top = '┌───────────────┐', bot = '└───────────────┘';
    const gap = '        ';
    const W = 17;
    const hdr = (t) => `<span class="h">${t.padEnd(W)}</span>`;
    const lines = [
      `${hdr('phones')}${gap}${hdr('api gateway')}${gap}${hdr('lambda')}${gap}${hdr('dynamodb')}`,
      `${top}${gap}${top}${gap}${top}${gap}${top}`,
      `${box(`${m.phones || 0} online`)}${arrow(1, runs, now)}${box(`${m.phones || 0} sockets`)}${arrow(1, runs, now + 333)}${box(`${runs.toFixed(1)} runs/s`)}${arrow(1, runs, now + 666)}${box(`${m.rows || 0} rows`)}`,
      `${box('tap · pull', 'm')}${arrow(-1, pushRate, now)}${box('always open', 'm')}${arrow(-1, pushRate, now + 500)}${box('your code', 'm')}${arrow(-1, runs, now + 250)}${box("who's here", 'm')}`,
      `${bot}${gap}${bot}${gap}${bot}${gap}${bot}`,
      '',
      `<span class="m">${'the browser'.padEnd(W)}${gap}${'the waiter'.padEnd(W)}${gap}${'the chef'.padEnd(W)}${gap}${'the fridge'.padEnd(W)}</span>`,
      '',
      lastCast
        ? `last broadcast  <span class="n">"${esc(lastCast.name)}"</span> → <span class="n">${lastCast.phones}</span> phones · all fire at <span class="a">${ASCII.stamp(lastCast.at)}</span> on aws time`
        : `<span class="m">last broadcast  none yet</span>`,
      `servers you manage  <span class="a">0</span>`,
    ];
    $('diagram').innerHTML = lines.join('\n');
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
