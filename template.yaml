AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  300 Phones, One Button - live crowd light show.
  WebSocket API (API Gateway) + Lambda + DynamoDB, website on S3 + CloudFront.

Parameters:
  AdminKey:
    Type: String
    NoEcho: true
    MinLength: 6
    Description: Secret key for the control panel
  UseCloudFront:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if your new AWS account is not yet allowed to create CloudFront distributions

Conditions:
  UseCdn: !Equals [!Ref UseCloudFront, 'true']
  NoCdn: !Equals [!Ref UseCloudFront, 'false']

Resources:
  # ---------- Database: who is connected ----------
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------- Real-time API: the "waiter" ----------
  ShowApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-ws'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  # ---------- Serverless code: the "chef" ----------
  ShowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 20
      Environment:
        Variables:
          TABLE: !Ref ConnectionsTable
          ADMIN_KEY: !Ref AdminKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ShowApi}/*'

  ShowIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ShowApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ShowFunction.Arn}/invocations'

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ShowApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ShowIntegration}'

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ShowApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ShowIntegration}'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ShowApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ShowIntegration}'

  ShowDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [ConnectRoute, DisconnectRoute, DefaultRoute]
    Properties:
      ApiId: !Ref ShowApi

  ShowStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ShowApi
      StageName: live
      DeploymentId: !Ref ShowDeployment
      DefaultRouteSettings:
        ThrottlingBurstLimit: 3000
        ThrottlingRateLimit: 1500

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ShowFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ShowApi}/*'

  # ---------- Website: the "menu" ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: !If
        - UseCdn
        - BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        - BlockPublicAcls: true
          BlockPublicPolicy: false
          IgnorePublicAcls: true
          RestrictPublicBuckets: false
      WebsiteConfiguration: !If
        - UseCdn
        - !Ref AWS::NoValue
        - IndexDocument: index.html

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCdn
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCdn
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} site'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized

  CdnBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCdn
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  PublicBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: NoCdn
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'

Outputs:
  WebSocketURL:
    Value: !Sub 'wss://${ShowApi}.execute-api.${AWS::Region}.amazonaws.com/live'
  SiteURL:
    Value: !If
      - UseCdn
      - !Sub 'https://${SiteDistribution.DomainName}'
      - !GetAtt SiteBucket.WebsiteURL
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !If [UseCdn, !Ref SiteDistribution, 'none']
  FunctionName:
    Value: !Ref ShowFunction
